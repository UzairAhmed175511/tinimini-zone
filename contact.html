<body data-page="contact">
  <div id="site-header"></div>
  <main id="main">
    <section class="page-hero"><div class="wrap"><h1>Contact us</h1><p class="lede">The quickest way to reach us is WhatsApp. We usually reply the same day.</p></div></section>
    <section class="wrap">
      <div class="contact-cards">
        <a href="#" data-wa="Hi Tinimini ZONE!" target="_blank" rel="noopener"><strong>WhatsApp</strong><span>0310 1310199</span></a>

      <div class="panel" style="max-width:760px">
        <h2>Send a message</h2>
        <form id="contact-form" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field">
          <input type="hidden" name="form-name" value="contact">
          <p class="hidden-field"><label>Leave this empty <input name="bot-field"></label></p>

            <div class="field full"><label for="c-msg">Message</label><textarea id="c-msg" name="message" required></textarea></div>
          </div>
          <div class="notice" id="contact-status" role="status" hidden style="margin-top:16px"></div>
          <button class="btn btn-primary" type="submit" style="margin-top:18px">Send message</button>
        </form>
      </div>
